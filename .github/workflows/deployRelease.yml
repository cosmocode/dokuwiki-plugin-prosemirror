name: Deploy Release

on:
    workflow_run:
        workflows: ["JS Test and DokuWiki Default Tasks"]
        branches: [master]
        types:
            - completed

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        steps:
            -   name: Checkout 🛎️
                uses: actions/checkout@v4

            -   name: Setup Node
                uses: actions/setup-node@v4
                with:
                    node-version: lts/*
                    cache: npm

            -   name: Install and Build 🔧
                run: |
                    npm ci
                    npm run build
                    rm -rf .github
                    rm -rf .gitignore
                    rm -rf _jstest
                    rm -rf _test
                    rm -rf node_modules
                    rm -rf package.json
                    rm -rf package-lock.json
                    rm -rf requirements.txt
                    rm -rf script

            -   name: Deploy 🚀
                uses: JamesIves/github-pages-deploy-action@4.1.4
                with:
                    branch: release
                    folder: .
