name: JS Test and DokuWiki Default Tasks
on:
  push:
  pull_request:
  schedule:
    - cron: '15 6 20 * *'
jobs:
  testJavaScript:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Run Tests
        run: npm test
  testPHP:
    uses: dokuwiki/github-action/.github/workflows/all.yml@main
